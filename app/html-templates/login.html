<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenSteps - Login</title>
  <link href="/styles.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 flex items-center justify-center p-4">
  <main>
    <div class="card w-full max-w-md">
      <div class="card-header text-center">
        <div class="flex justify-center mb-4">
          <div class="bg-green-100 p-3 rounded-full">
            <svg class="h-8 w-8 text-green-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L22 8.5V15.5L12 22L2 15.5V8.5L12 2Z"></path>
              <path d="M12 22V15.5"></path>
              <path d="M22 8.5L12 15.5L2 8.5"></path>
              <path d="M2 15.5L12 8.5L22 15.5"></path>
              <path d="M12 2V8.5"></path>
            </svg>
          </div>
        </div>
        <h1 class="text-2xl font-bold text-green-800">GreenSteps</h1>
        <p class="text-gray-500">Platform Peduli Lingkungan Indonesia</p>
      </div>
      
      <div class="card-content">
        <div class="tabs">
          <div class="tabs-list grid grid-cols-2">
            <button class="tab-trigger active" data-tab="login">Masuk</button>
            <button class="tab-trigger" data-tab="register">Daftar</button>
          </div>
          
          <div class="tab-content active" id="login-tab">
            <form id="login-form" class="space-y-4">
              <div class="space-y-2">
                <label for="email" class="block text-sm font-medium">Email</label>
                <div class="relative">
                  <span class="absolute left-3 top-3 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                      <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                  </span>
                  <input id="email" type="email" placeholder="Masukkan email Anda" class="pl-10 w-full p-2 border rounded" required>
                </div>
              </div>
              
              <div class="space-y-2">
                <label for="password" class="block text-sm font-medium">Password</label>
                <div class="relative">
                  <span class="absolute left-3 top-3 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                  </span>
                  <input id="password" type="password" placeholder="Masukkan password Anda" class="pl-10 w-full p-2 border rounded" required>
                </div>
              </div>
              
              <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white p-2 rounded">
                Masuk
              </button>
            </form>
          </div>
          
          <div class="tab-content" id="register-tab">
            <form id="register-form" class="space-y-4">
              <div class="space-y-2">
                <label for="name" class="block text-sm font-medium">Nama Lengkap</label>
                <div class="relative">
                  <span class="absolute left-3 top-3 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                  </span>
                  <input id="name" type="text" placeholder="Masukkan nama lengkap Anda" class="pl-10 w-full p-2 border rounded" required>
                </div>
              </div>
              
              <div class="space-y-2">
                <label for="register-email" class="block text-sm font-medium">Email</label>
                <div class="relative">
                  <span class="absolute left-3 top-3 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                      <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                  </span>
                  <input id="register-email" type="email" placeholder="Masukkan email Anda" class="pl-10 w-full p-2 border rounded" required>
                </div>
              </div>
              
              <div class="space-y-2">
                <label for="register-password" class="block text-sm font-medium">Password</label>
                <div class="relative">
                  <span class="absolute left-3 top-3 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                  </span>
                  <input id="register-password" type="password" placeholder="Masukkan password Anda" class="pl-10 w-full p-2 border rounded" required>
                </div>
              </div>
              
              <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white p-2 rounded">
                Daftar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Script untuk menangani tab login/register
    document.addEventListener('DOMContentLoaded', function() {
      const tabTriggers = document.querySelectorAll('.tab-trigger');
      const tabContents = document.querySelectorAll('.tab-content');
      
      tabTriggers.forEach(trigger => {
        trigger.addEventListener('click', function() {
          // Hapus kelas active dari semua trigger dan content
          tabTriggers.forEach(t => t.classList.remove('active'));
          tabContents.forEach(c => c.classList.remove('active'));
          
          // Tambahkan kelas active ke trigger yang diklik
          this.classList.add('active');
          
          // Tampilkan content yang sesuai
          const tabId = this.getAttribute('data-tab');
          document.getElementById(`${tabId}-tab`).classList.add('active');
        });
      });
      
      // Handle form submission
      document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Simpan ke localStorage untuk demo
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);
        
        if (user) {
          localStorage.setItem('currentUser', JSON.stringify(user));
          window.location.href = '/dashboard.html';
        } else {
          alert('Email atau password salah!');
        }
      });
      
      document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        
        // Simpan ke localStorage untuk demo
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const existingUser = users.find(u => u.email === email);
        
        if (existingUser) {
          alert('Email sudah terdaftar!');
          return;
        }
        
        const newUser = {
          id: Date.now(),
          name,
          email,
          password,
          avatar: '/placeholder.svg?height=40&width=40',
          points: 0,
          posts: [],
          completedMissions: []
        };
        
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        localStorage.setItem('currentUser', JSON.stringify(newUser));
        window.location.href = '/dashboard.html';
      });
    });
  </script>
</body>
</html>
